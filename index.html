<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>TVM3U Player</title>
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
<style>
    body { 
        margin: 0; 
        background-color: #000; 
        overflow: hidden; 
        font-family: sans-serif; 
    }
    #container { 
        position: relative; 
        width: 100vw; 
        height: 100vh; 
    }
    
    .player-element { 
        position: absolute; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%; 
        z-index: 1; 
    }
    
    /* Lista de canales expandida para fuentes más grandes */
    #channel-list { 
        position: absolute; 
        top: 0;
        left: 0;
        z-index: 10; 
        width: 480px; /* Aumentado de 350px a 480px para dar espacio al texto más grande */
        background: rgba(15, 15, 15, 0.94); 
        color: white; 
        height: 100%; 
        overflow-y: auto; 
        transition: transform 0.3s ease-in-out;
    }

    #channel-list.hidden { 
        transform: translateX(-100%); 
    }

    #playlist { 
        list-style: none; 
        padding: 0; 
        margin: 0; 
    }

    /* Tamaño de letra de la lista de canales (+50%) */
    #playlist li { 
        padding: 22px 20px; 
        border-bottom: 1px solid #333; 
        color: #ccc; 
        font-size: 24px; /* Aumentado de 16px a 24px */
        line-height: 1.3;
    }

    #playlist li.selected { 
        background-color: #e50914; 
        color: #fff; 
        font-weight: bold; 
    }

    /* Banner flotante (OSD) con texto aumentado (+50%) */
    #osd-banner {
        position: absolute;
        bottom: 50px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        background: rgba(0, 0, 0, 0.9);
        color: #fff;
        padding: 22px 45px; /* Más acolchado para acomodar el texto */
        border-radius: 12px;
        border-left: 8px solid #e50914;
        box-shadow: 0 6px 20px rgba(0,0,0,0.7);
        display: flex;
        align-items: center;
        gap: 25px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease-in-out;
    }

    #osd-banner.show {
        opacity: 1;
    }

    /* Número de canal OSD (+50%) */
    #osd-number {
        font-size: 36px; /* Aumentado de 24px a 36px */
        font-weight: bold;
        color: #e50914;
    }

    /* Nombre de canal OSD (+50%) */
    #osd-title {
        font-size: 30px; /* Aumentado de 20px a 30px */
        font-weight: 500;
    }
</style>
</head>
<body>
    <div id="container">
        <div id="media-player-wrapper" class="player-element"></div>
        
        <!-- Lista de canales -->
        <div id="channel-list">
            <ul id="playlist"></ul>
        </div>

        <!-- Banner Flotante de Información -->
        <div id="osd-banner">
            <span id="osd-number">01</span>
            <span id="osd-title">Nombre del canal</span>
        </div>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
