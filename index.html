<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>TVM3U Player</title>
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
    <div id="container">
        <!-- Elemento nativo de reproductor para Samsung Tizen -->
        <object id="avplayer" type="application/avplayer" style="width: 100%; height: 100%; position: absolute; z-index: 1;"></object>
        
        <!-- Interfaz sobrepuesta para la lista de canales -->
        <div id="channel-list" style="position: absolute; z-index: 2; width: 300px; background: rgba(0,0,0,0.8); color: white; height: 100%; overflow-y: auto;">
            <ul id="playlist"></ul>
        </div>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
