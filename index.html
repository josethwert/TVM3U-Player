<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>TVM3U Player</title>
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #container { position: relative; width: 100vw; height: 100vh; }
        
        .player-element { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Lista de canales */
        #channel-list { 
            position: absolute; 
            top: 0;
            left: 0;
            z-index: 10; 
            width: 350px; 
            background: rgba(15, 15, 15, 0.92); 
            color: white; 
            height: 100%; 
            overflow-y: auto; 
            transition: transform 0.3s ease-in-out;
        }

        #channel-list.hidden { transform: translateX(-100%); }

        #playlist { list-style: none; padding: 0; margin: 0; }
        #playlist li { padding: 15px; border-bottom: 1px solid #333; color: #ccc; font-size: 16px; }
        #playlist li.selected { background-color: #e50914; color: #fff; font-weight: bold; }

        /* Banner flotante (OSD) */
        #osd-banner {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px 30px;
            border-radius: 8px;
            border-left: 5px solid #e50914;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease-in-out;
        }

        #osd-banner.show {
            opacity: 1;
        }

        #osd-number {
            font-size: 24px;
            font-weight: bold;
            color: #e50914;
        }

        #osd-title {
            font-size: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="media-player-wrapper" class="player-element"></div>
        
        <!-- Lista de canales -->
        <div id="channel-list">
            <ul id="playlist"></ul>
        </div>

        <!-- Banner Flotante de Información -->
        <div id="osd-banner">
            <span id="osd-number">01</span>
            <span id="osd-title">Nombre del canal</span>
        </div>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
